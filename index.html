<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

</head>


<body>
    <h1>Hello</h1>
    <p id="parag1">This is my practical examination</p>

    <button id="btn1">Alert Me</button>

    <button id="btn2">Change Color</button>
    <script>
    const p1 = document.getElementById("parag1"); 
  

    const b1 = document.querySelector('#btn1');
    b1.addEventListener('click', () => {
        alert("Button 1 triggered");
    });

    const b2 = document.querySelector("#btn2");
    b2.addEventListener('dblclick', function (){
          p1.style.color = "red";
    });
    
</script>
</body>
</html>
